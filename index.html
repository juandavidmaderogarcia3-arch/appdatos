    function MatrizModulo({ showToast, sound }) {
      const [filas, setFilas] = useState('3');
      const [cols, setCols] = useState('3');
      const [matriz, setMatriz] = useState([
        [14, 88, 32],
        [65, 42, 91],
        [27, 53, 76]
      ]);
      const [isCreated, setIsCreated] = useState(true);
      const [selFila, setSelFila] = useState('');
      const [selCol, setSelCol] = useState('');
      const [modVal, setModVal] = useState('');
      const [highlightCell, setHighlightCell] = useState(null);

      const crearMatriz = () => {
        const f = parseInt(filas);
        const c = parseInt(cols);
        if (isNaN(f) || f <= 0 || f > 5 || isNaN(c) || c <= 0 || c > 5) {
          showToast('❌ Filas y columnas entre 1 y 5.', 'error');
          return;
        }
        const m = Array.from({ length: f }, () =>
          Array.from({ length: c }, () => Math.floor(Math.random() * 89) + 10)
        );
        setMatriz(m);
        setIsCreated(true);
        if (sound) playSound('insert');
        showToast(`✅ Matriz ${f}x${c} mapeada en RAM (${f*c} posiciones).`);
      };

      const consultarCelda = () => {
        const f = parseInt(selFila);
        const c = parseInt(selCol);
        if (isNaN(f) || isNaN(c) || f < 0 || f >= matriz.length || c < 0 || c >= matriz[0].length) {
          showToast('❌ Coordenadas fuera de rango.', 'error');
          return;
        }
        setHighlightCell({ f, c });
        if (sound) playSound('click');
        const linearIdx = f * matriz[0].length + c;
        showToast(`👉 Matriz[${f}][${c}] = ${matriz[f][c]} (Dirección Offset RAM: +${linearIdx * 4}B)`);
      };

      const modificarCelda = () => {
        const f = parseInt(selFila);
        const c = parseInt(selCol);
        const val = parseInt(modVal);
        if (isNaN(f) || isNaN(c) || f < 0 || f >= matriz.length || c < 0 || c >= matriz[0].length) {
          showToast('❌ Coordenada inválida.', 'error');
          return;
        }
        if (isNaN(val)) {
          showToast('❌ Valor no numérico.', 'error');
          return;
        }
        const nueva = matriz.map(r => [...r]);
        nueva[f][c] = val;
        setMatriz(nueva);
        setHighlightCell({ f, c });
        if (sound) playSound('success');
        showToast(`✅ Celda [${f}][${c}] actualizada a ${val}.`);
      };

      return (
        <div class="space-y-6">
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                <Icon name="grid" className="text-cyan-400" />
                2. Matriz Bidimensional (2D) & Row-Major Order
              </h2>
              <p class="text-xs text-slate-400">Mapeo de memoria bidimensional contigua [Fila × Columna].</p>
            </div>
            <button onClick={() => setIsCreated(!isCreated)} class="text-xs bg-slate-900 hover:bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 text-cyan-300 font-mono">
              {isCreated ? 'Reconfigurar Matriz' : 'Ver Matriz'}
            </button>
          </div>
          <ComplexityBadge 
            access="O(1)" search="O(F × C)" insert="O(1)" deleteOp="N/A"
            codeSnippet={`# Acceso directo en Matriz 2D mediante offset de fila mayor
def consultar_celda(matriz, fila, col, num_cols):
    return matriz[fila][col]`}
          />
          {!isCreated ? (
            <div class="max-w-md bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-4">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1 font-mono">Filas (1-5):</label>
                  <input type="number" value={filas} onChange={e=>setFilas(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1 font-mono">Columnas (1-5):</label>
                  <input type="number" value={cols} onChange={e=>setCols(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono" />
                </div>
              </div>
              <button onClick={crearMatriz} class="w-full bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 text-white font-bold py-2.5 rounded-xl">
                Generar Matriz
              </button>
            </div>
          ) : (
            <div class="space-y-6">
              <div class="bg-slate-955 p-6 rounded-3xl border border-slate-800 overflow-x-auto">
                <table class="border-separate border-spacing-3 mx-auto">
                  <thead>
                    <tr>
                      <th class="p-2 text-xs font-mono text-slate-500">f\c</th>
                      {matriz[0].map((_, c) => (
                        <th key={c} class="p-2 text-xs font-mono text-cyan-400 font-bold">Col {c}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {matriz.map((row, f) => (
                      <tr key={f}>
                        <td class="p-2 text-xs font-mono text-cyan-400 font-bold">Fila {f}</td>
                        {row.map((cell, c) => {
                          const isSel = highlightCell?.f === f && highlightCell?.c === c;
                          const offset = f * matriz[0].length + c;
                          return (
                            <td key={c}>
                              <div class={`w-20 h-20 rounded-2xl flex flex-col items-center justify-center font-bold border transition-all duration-300 ${
                                isSel ? 'bg-indigo-600 border-cyan-300 text-white scale-110 shadow-2xl shadow-indigo-500/50 pulse-glow' : 'bg-slate-900 border-slate-800 text-slate-200 hover:border-slate-700'
                              }`}>
                                <span class="text-lg font-mono">{cell}</span>
                                <span class="text-[9px] font-mono text-slate-500">[{f}][{c}]</span>
                                <span class="text-[8px] font-mono text-cyan-400/80">{getHexAddr(0x7FFF30, offset)}</span>
                              </div>
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-wrap gap-4 items-center justify-between font-mono">
                <div class="flex items-center gap-2">
                  <input type="number" placeholder="Fila" value={selFila} onChange={e=>setSelFila(e.target.value)} class="w-20 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                  <input type="number" placeholder="Col" value={selCol} onChange={e=>setSelCol(e.target.value)} class="w-20 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                  <button onClick={consultarCelda} class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-semibold">Consultar</button>
                </div>
                <div class="flex items-center gap-2">
                  <input type="number" placeholder="Nuevo valor" value={modVal} onChange={e=>setModVal(e.target.value)} class="w-28 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                  <button onClick={modificarCelda} class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">Modificar Celda</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ListaModulo({ showToast, sound }) {
      const [lista, setLista] = useState([
        { val: 12, addr: '0x8FA0', next: '0x8FA8' },
        { val: 38, addr: '0x8FA8', next: '0x8FC0' },
        { val: 55, addr: '0x8FC0', next: '0x8FD4' },
        { val: 91, addr: '0x8FD4', next: 'NULL' }
      ]);
      const [nuevoValor, setNuevoValor] = useState('');
      const [buscarVal, setBuscarVal] = useState('');
      const [highlightIdx, setHighlightIdx] = useState(null);

      const insertarNodo = () => {
        const val = parseInt(nuevoValor);
        if (isNaN(val)) {
          showToast('❌ Ingrese un entero válido.', 'error');
          return;
        }
        const newAddr = '0x' + (Math.floor(Math.random() * 0xFFF) + 0x8000).toString(16).toUpperCase();
        let copia = [...lista];
        if (copia.length > 0) {
          copia[copia.length - 1].next = newAddr;
        }
        copia.push({ val, addr: newAddr, next: 'NULL' });
        setLista(copia);
        setNuevoValor('');
        if (sound) playSound('insert');
        showToast(`✅ Nuevo nodo (${val}) alojado en dirección Heap [${newAddr}].`);
      };

      const eliminarNodo = (val) => {
        const idx = lista.findIndex(n => n.val === val);
        if (idx === -1) {
          showToast('❌ Dato no encontrado en la lista.', 'error');
          return;
        }
        let copia = lista.filter((_, i) => i !== idx);
        if (idx > 0 && idx - 1 < copia.length) {
          copia[idx - 1].next = idx < lista.length - 1 ? copia[idx].addr : 'NULL';
        }
        setLista(copia);
        if (sound) playSound('delete');
        showToast(`✅ Nodo ${val} desasignado de la memoria Heap.`);
      };

      const buscarNodo = () => {
        const val = parseInt(buscarVal);
        const idx = lista.findIndex(n => n.val === val);
        if (idx === -1) {
          setHighlightIdx(null);
          showToast(`❌ El valor ${val} NO existe en los nodos enlazados.`, 'warning');
        } else {
          setHighlightIdx(idx);
          if (sound) playSound('click');
          showToast(`👉 Nodo hallado en dirección Heap ${lista[idx].addr}.`);
        }
      };

      return (
        <div class="space-y-6">
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                <Icon name="git-commit" className="text-cyan-400" />
                3. Lista Enlazada Dinámica (Memoria Heap)
              </h2>
              <p class="text-xs text-slate-400">Nodos no contiguos enlazados mediante punteros de memoria explícitos.</p>
            </div>
          </div>
          <ComplexityBadge 
            access="O(N)" search="O(N)" insert="O(1)" deleteOp="O(1)"
            codeSnippet={`# Nodo de Lista Simplemente Enlazada
class Nodo:
    def __init__(self, valor):
        self.valor = valor
        self.siguiente = None`}
          />
          <div class="bg-slate-955 p-8 rounded-3xl border border-slate-800 overflow-x-auto custom-scrollbar">
            <div class="flex items-center gap-4 min-w-max py-4 font-mono">
              <div class="bg-indigo-950/80 border border-indigo-500 px-4 py-3 rounded-2xl text-cyan-300 text-xs font-bold shadow-lg shadow-indigo-500/20">
                <div>HEAD</div>
                <div class="text-[9px] text-slate-400">{lista.length > 0 ? lista[0].addr : 'NULL'}</div>
              </div>
              <Icon name="arrow-right" className="text-cyan-400 w-5 h-5 animate-pulse" />
              {lista.length === 0 ? (
                <span class="text-slate-600 text-sm">Lista Vacía (NULL)</span>
              ) : (
                lista.map((node, idx) => {
                  const isSel = highlightIdx === idx;
                  return (
                    <React.Fragment key={idx}>
                      <div class={`node-pop glass-panel rounded-2xl p-4 flex items-center gap-4 border transition-all duration-300 ${
                        isSel ? 'border-cyan-400 bg-indigo-600/30 scale-105 shadow-2xl shadow-cyan-500/30 pulse-glow' : 'border-slate-800 hover:border-slate-700'
                      }`}>
                        <div class="flex flex-col">
                          <span class="text-[9px] text-cyan-400">ADDR: {node.addr}</span>
                          <span class="text-xl font-bold text-white">{node.val}</span>
                        </div>
                        <div class="h-10 w-px bg-slate-800"></div>
                        <div class="flex flex-col items-center">
                          <span class="text-[9px] text-slate-500">NEXT</span>
                          <span class="text-[10px] text-emerald-400 font-bold">{node.next}</span>
                        </div>
                        <button onClick={() => eliminarNodo(node.val)} class="text-slate-500 hover:text-rose-400 transition ml-2">
                          <Icon name="trash-2" className="w-4 h-4" />
                        </button>
                      </div>
                      <Icon name="arrow-right" className="text-slate-600 w-5 h-5" />
                    </React.Fragment>
                  );
                })
              )}
              <div class="bg-slate-900 border border-slate-800 px-4 py-3 rounded-2xl text-slate-500 text-xs font-bold">
                NULL
              </div>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex gap-2 font-mono">
              <input type="number" placeholder="Nuevo valor" value={nuevoValor} onChange={e=>setNuevoValor(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
              <button onClick={insertarNodo} class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">
                Insertar Nodo
              </button>
            </div>
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex gap-2 font-mono">
              <input type="number" placeholder="Buscar valor" value={buscarVal} onChange={e=>setBuscarVal(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
              <button onClick={buscarNodo} class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-semibold">
                Buscar Nodo
              </button>
            </div>
          </div>
        </div>
      );
    }

    function PilaModulo({ showToast, sound }) {
      const [pila, setPila] = useState([18, 42, 77]);
      const [inputVal, setInputVal] = useState('');

      const push = () => {
        const val = parseInt(inputVal);
        if (isNaN(val)) {
          showToast('❌ Ingrese un entero válido.', 'error');
          return;
        }
        setPila([...pila, val]);
        setInputVal('');
        if (sound) playSound('push');
        showToast(`✅ Push: ${val} apilado en la cima.`);
      };

      const pop = () => {
        if (pila.length === 0) {
          showToast('❌ Underflow: Intento de retirado en PILA VACÍA.', 'error');
          return;
        }
        const copia = [...pila];
        const rem = copia.pop();
        setPila(copia);
        if (sound) playSound('pop');
        showToast(`✅ Pop: Extraído elemento ${rem} de la Cima.`);
      };

      const peek = () => {
        if (pila.length === 0) {
          showToast('❌ La pila está vacía.', 'warning');
          return;
        }
        if (sound) playSound('click');
        showToast(`👉 Cima actual (Peek): ${pila[pila.length - 1]}`);
      };

      return (
        <div class="space-y-6">
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                <Icon name="layers" className="text-cyan-400" />
                4. Pila Animada (Stack - LIFO)
              </h2>
              <p class="text-xs text-slate-400">Last In, First Out (Último en Entrar, Primero en Salir).</p>
            </div>
          </div>
          <ComplexityBadge 
            access="O(N)" search="O(N)" insert="O(1)" deleteOp="O(1)"
            codeSnippet={`# Estructura Pila (Stack) LIFO
pila = []
pila.append(10)  # Push O(1)
top = pila[-1]   # Peek O(1)
elem = pila.pop() # Pop O(1)`}
          />
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
            <div class="bg-slate-955 p-6 rounded-3xl border border-slate-800 flex flex-col items-center min-h-[360px]">
              <span class="text-xs font-mono font-bold text-cyan-400 mb-4 px-3 py-1 bg-indigo-950/80 rounded-full border border-indigo-700">
                ▲ CIMA (TOP OF STACK) ▲
              </span>
              <div class="w-60 flex flex-col gap-2.5">
                {pila.length === 0 ? (
                  <div class="py-20 text-center text-slate-600 font-mono text-sm border border-dashed border-slate-800 rounded-2xl">Pila Vacía</div>
                ) : (
                  [...pila].reverse().map((val, idx) => {
                    const isTop = idx === 0;
                    return (
                      <div 
                        key={idx} 
                        class={`node-pop p-4 rounded-2xl border font-bold text-center text-lg transition-all font-mono ${
                          isTop ? 'bg-gradient-to-r from-indigo-600 via-violet-600 to-cyan-500 border-cyan-300 text-white shadow-2xl shadow-indigo-500/50 pulse-glow' : 'bg-slate-900 border-slate-800 text-slate-300'
                        }`}
                      >
                        <div class="flex justify-between items-center px-2">
                          <span class="text-xs font-mono opacity-70">{isTop ? '[TOP]' : ''}</span>
                          <span>{val}</span>
                          <span class="text-xs font-mono opacity-50">Pos {pila.length - 1 - idx}</span>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
              <span class="text-xs font-mono text-slate-600 mt-auto pt-4 border-t border-slate-800 w-full text-center">BASE DE LA PILA</span>
            </div>
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-4 font-mono">
              <h4 class="text-xs font-semibold text-white">Operaciones LIFO:</h4>
              <div class="flex gap-2">
                <input type="number" placeholder="Valor" value={inputVal} onChange={e=>setInputVal(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                <button onClick={push} class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30">Apilar (Push)</button>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <button onClick={pop} class="bg-rose-950/60 border border-rose-800/80 hover:bg-rose-900 text-rose-200 py-2.5 rounded-xl text-xs font-semibold">Desapilar (Pop)</button>
                <button onClick={peek} class="bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-xl text-xs font-semibold">Cima (Peek)</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ColaModulo({ showToast, sound }) {
      const [cola, setCola] = useState([10, 20, 30, 40]);
      const [inputVal, setInputVal] = useState('');

      const enqueue = () => {
        const val = parseInt(inputVal);
        if (isNaN(val)) {
          showToast('❌ Ingrese un entero válido.', 'error');
          return;
        }
        setCola([...cola, val]);
        setInputVal('');
        if (sound) playSound('push');
        showToast(`✅ Enqueue: Elemento ${val} ingresado al final.`);
      };

      const dequeue = () => {
        if (cola.length === 0) {
          showToast('❌ Underflow: COLA VACÍA.', 'error');
          return;
        }
        const rem = cola[0];
        setCola(cola.slice(1));
        if (sound) playSound('pop');
        showToast(`✅ Dequeue: Elemento ${rem} retirado del frente.`);
      };

      const peek = () => {
        if (cola.length === 0) {
          showToast('❌ Cola vacía.', 'warning');
          return;
        }
        if (sound) playSound('click');
        showToast(`👉 Frente (Peek): ${cola[0]}`);
      };

      return (
        <div class="space-y-6">
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                <Icon name="arrow-right-left" className="text-cyan-400" />
                5. Cola Animada (Queue - FIFO)
              </h2>
              <p class="text-xs text-slate-400">First In, First Out (Primero en Entrar, Primero en Salir).</p>
            </div>
          </div>
          <ComplexityBadge 
            access="O(N)" search="O(N)" insert="O(1)" deleteOp="O(1)"
            codeSnippet={`# Estructura Cola FIFO con deque
from collections import deque
cola = deque()
cola.append(10)      # Enqueue O(1)
frente = cola[0]     # Peek O(1)
elem = cola.popleft()# Dequeue O(1)`}
          />
          <div class="bg-slate-955 p-8 rounded-3xl border border-slate-800 overflow-x-auto custom-scrollbar">
            <div class="flex items-center gap-4 min-w-max py-4 font-mono">
              <span class="text-xs font-bold text-emerald-400 bg-emerald-950/80 border border-emerald-700 px-3.5 py-2 rounded-xl shadow-lg shadow-emerald-500/20">FRENTE (Dequeue)</span>
              <Icon name="arrow-right" className="text-emerald-400 w-5 h-5 animate-pulse" />
              {cola.length === 0 ? (
                <span class="text-slate-600 text-sm px-8">Cola Vacía</span>
              ) : (
                cola.map((val, idx) => {
                  const isFront = idx === 0;
                  return (
                    <div 
                      key={idx} 
                      class={`node-pop p-4 rounded-2xl border font-bold text-lg text-center min-w-[75px] ${
                        isFront ? 'bg-gradient-to-tr from-emerald-600 to-teal-500 border-emerald-300 text-white shadow-2xl shadow-emerald-500/30 pulse-glow' : 'bg-slate-900 border-slate-800 text-slate-300'
                      }`}
                    >
                      {val}
                    </div>
                  );
                })
              )}
              <Icon name="arrow-right" className="text-cyan-400 w-5 h-5" />
              <span class="text-xs font-bold text-cyan-400 bg-indigo-950/80 border border-indigo-700 px-3.5 py-2 rounded-xl shadow-lg shadow-indigo-500/20">FINAL (Enqueue)</span>
            </div>
          </div>
          <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-wrap gap-4 items-center justify-between font-mono">
            <div class="flex gap-2 flex-1 min-w-[200px]">
              <input type="number" placeholder="Valor" value={inputVal} onChange={e=>setInputVal(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
              <button onClick={enqueue} class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30">Enqueue</button>
            </div>
            <div class="flex gap-2">
              <button onClick={dequeue} class="bg-rose-950/60 border border-rose-800/80 hover:bg-rose-900 text-rose-200 px-4 py-2 rounded-xl text-xs font-semibold">Dequeue</button>
              <button onClick={peek} class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-semibold">Frente (Peek)</button>
            </div>
          </div>
        </div>
      );
    }

    function ArbolModulo({ showToast, sound, animSpeed }) {
      const [treeData, setTreeData] = useState({
        val: '50',
        left: {
          val: '30',
          left: { val: '20', left: null, right: null },
          right: { val: '40', left: null, right: null }
        },
        right: {
          val: '70',
          left: { val: '60', left: null, right: null },
          right: { val: '80', left: null, right: null }
        }
      });
      const [inputValue, setInputValue] = useState('');
      const [insertMode, setInsertMode] = useState('auto');
      const [targetParent, setTargetParent] = useState('');
      const [valToDelete, setValToDelete] = useState('');
      const [activeNodeVal, setActiveNodeVal] = useState(null);
      const [traversalResult, setTraversalResult] = useState([]);
      const [currentTraversalType, setCurrentTraversalType] = useState('');
      const [isAnimating, setIsAnimating] = useState(false);

      const getAllValues = (node, list = []) => {
        if (!node) return list;
        getAllValues(node.left, list);
        list.push(String(node.val));
        getAllValues(node.right, list);
        return list;
      };

      const compareVals = (a, b) => {
        const numA = Number(a);
        const numB = Number(b);
        if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
        return String(a).localeCompare(String(b));
      };

      const insertNodeAuto = (root, value) => {
        if (!root) return { val: String(value), left: null, right: null };
        const cmp = compareVals(value, root.val);
        if (cmp < 0) {
          return { ...root, left: insertNodeAuto(root.left, value) };
        } else if (cmp > 0) {
          return { ...root, right: insertNodeAuto(root.right, value) };
        }
        return root;
      };

      const insertNodeManual = (root, parentVal, newVal, side) => {
        if (!root) return null;
        if (String(root.val) === String(parentVal)) {
          if (side === 'left') {
            return { ...root, left: { val: String(newVal), left: root.left, right: null } };
          } else {
            return { ...root, right: { val: String(newVal), left: null, right: root.right } };
          }
        }
        return {
          ...root,
          left: insertNodeManual(root.left, parentVal, newVal, side),
          right: insertNodeManual(root.right, parentVal, newVal, side)
        };
      };

      const findMin = (node) => {
        while (node.left) node = node.left;
        return node;
      };

      const deleteNodeInTree = (root, value) => {
        if (!root) return null;
        if (String(root.val) === String(value)) {
          if (!root.left) return root.right;
          if (!root.right) return root.left;
          const temp = findMin(root.right);
          root.val = temp.val;
          root.right = deleteNodeInTree(root.right, temp.val);
          return { ...root };
        }
        return {
          ...root,
          left: deleteNodeInTree(root.left, value),
          right: deleteNodeInTree(root.right, value)
        };
      };

      const handleInsert = (e) => {
        if (e) e.preventDefault();
        const valStr = inputValue.trim();
        if (!valStr) {
          showToast('⚠️ Ingresa un número o palabra válida', 'warning');
          return;
        }
        const currentVals = getAllValues(treeData);
        if (currentVals.includes(valStr)) {
          showToast(`⚠️ El elemento '${valStr}' ya existe en el árbol`, 'warning');
          return;
        }
        if (insertMode === 'auto') {
          setTreeData((prevTree) => insertNodeAuto(prevTree, valStr));
          showToast(`✅ '${valStr}' insertado automáticamente según BST`, 'success');
        } else {
          if (!targetParent) {
            showToast('⚠️ Selecciona un nodo Padre objetivo para ubicar el nuevo nodo', 'warning');
            return;
          }
          setTreeData((prevTree) => insertNodeManual(prevTree, targetParent, valStr, insertMode));
          showToast(`✅ '${valStr}' insertado a la ${insertMode === 'left' ? 'IZQUIERDA' : 'DERECHA'} de [${targetParent}]`, 'success');
        }
        setInputValue('');
        if (sound) playSound('insert');
      };

      const handleDeleteValue = (valTarget) => {
        const targetStr = String(valTarget);
        if (!targetStr) return;
        setActiveNodeVal(targetStr);
        setTimeout(() => {
          setTreeData((prevTree) => deleteNodeInTree(prevTree, targetStr));
          setActiveNodeVal(null);
          setValToDelete('');
          setTraversalResult([]);
          if (sound) playSound('delete');
          showToast(`🗑️ Elemento '${targetStr}' eliminado del árbol`, 'info');
        }, 200);
      };

      const handleClearTree = (e) => {
        if (e) e.preventDefault();
        setTreeData(null);
        setTraversalResult([]);
        if (sound) playSound('delete');
        showToast('🧹 Árbol vaciado por completo', 'warning');
      };

      const getInorder = (node, acc = []) => {
        if (!node) return acc;
        getInorder(node.left, acc);
        acc.push(String(node.val));
        getInorder(node.right, acc);
        return acc;
      };

      const getPreorder = (node, acc = []) => {
        if (!node) return acc;
        acc.push(String(node.val));
        getPreorder(node.left, acc);
        getPreorder(node.right, acc);
        return acc;
      };

      const getPostorder = (node, acc = []) => {
        if (!node) return acc;
        getPostorder(node.left, acc);
        getPostorder(node.right, acc);
        acc.push(String(node.val));
        return acc;
      };

      const animateTraversal = (sequence, typeName) => {
        if (isAnimating || !sequence.length) return;
        setIsAnimating(true);
        setCurrentTraversalType(typeName);
        setTraversalResult([]);
        let step = 0;
        const intervalTime = Math.max(250, 700 / animSpeed);
        const timer = setInterval(() => {
          if (step < sequence.length) {
            const currentVal = sequence[step];
            setActiveNodeVal(currentVal);
            setTraversalResult((prev) => [...prev, currentVal]);
            if (sound) playSound('click');
            step++;
          } else {
            clearInterval(timer);
            setActiveNodeVal(null);
            setIsAnimating(false);
            if (sound) playSound('success');
            showToast(`✨ Recorrido ${typeName} completado`, 'info');
          }
        }, intervalTime);
      };

      const renderTreeGraph = (node) => {
        if (!node) return null;
        const nodeStr = String(node.val);
        const isActive = String(activeNodeVal) === nodeStr;
        return (
          <div class="flex flex-col items-center">
            <button
              type="button"
              onClick={() => handleDeleteValue(nodeStr)}
              title={`Haz clic para eliminar [${nodeStr}]`}
              class={`min-w-[48px] h-12 px-3 rounded-full flex items-center justify-center font-mono font-extrabold text-xs border-2 transition-all duration-300 shadow-lg cursor-pointer group hover:scale-110 ${
                isActive
                  ? 'bg-amber-400 border-amber-200 text-black scale-125 shadow-amber-400/80 ring-4 ring-amber-400/40 animate-pulse'
                  : 'bg-gradient-to-b from-indigo-600 to-blue-800 border-cyan-400 text-white shadow-cyan-500/30 hover:border-rose-400 hover:from-rose-600 hover:to-rose-800'
              }`}
            >
              <span class="group-hover:hidden truncate max-w-[80px]">{nodeStr}</span>
              <span class="hidden group-hover:inline text-xs font-bold">✕</span>
            </button>
            {(node.left || node.right) && (
              <div class="flex gap-8 pt-6 relative">
                {node.left ? (
                  <div class="flex flex-col items-center relative">
                    <div class="absolute -top-6 right-1/2 w-1/2 h-6 border-t-2 border-l-2 border-cyan-500/40 rounded-tl-lg"></div>
                    {renderTreeGraph(node.left)}
                  </div>
                ) : (
                  <div class="w-8"></div>
                )}
                {node.right ? (
                  <div class="flex flex-col items-center relative">
                    <div class="absolute -top-6 left-1/2 w-1/2 h-6 border-t-2 border-r-2 border-cyan-500/40 rounded-tr-lg"></div>
                    {renderTreeGraph(node.right)}
                  </div>
                ) : (
                  <div class="w-8"></div>
                )}
              </div>
            )}
          </div>
        );
      };

      const allNodesList = getAllValues(treeData);
      return (
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-indigo-500/30 space-y-6 page-enter">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
                <h3 class="text-xl font-black text-cyan-300">6. Árbol Binario (Soporta Texto & Números)</h3>
              </div>
              <p class="text-xs text-slate-400 font-mono mt-1">
                Acepta palabras o valores numéricos • Inserción automática BST o asignación manual (Izquierda / Derecha)
              </p>
            </div>
            <div class="flex items-center gap-2">
              <span class="px-3 py-1 bg-cyan-950/80 border border-cyan-500/40 text-cyan-300 text-xs font-mono font-bold rounded-full">
                Total Nodos: {allNodesList.length}
              </span>
            </div>
          </div>
          <div class="bg-[#050814] rounded-2xl border border-slate-800/80 p-8 min-h-[300px] flex items-center justify-center overflow-x-auto custom-scrollbar relative">
            {treeData ? (
              renderTreeGraph(treeData)
            ) : (
              <div class="text-center font-mono text-xs text-slate-500 py-10 space-y-2">
                <p>[ El Árbol está vacío ]</p>
                <p class="text-[10px] text-slate-600">Inserta nuevos valores o palabras para construirlo</p>
              </div>
            )}
          </div>
          <form onSubmit={handleInsert} class="bg-[#070b18] p-4 rounded-2xl border border-slate-800 space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
              <input
                type="text"
                value={inputValue}
                onChange={(e) => setInputValue(e.target.value)}
                placeholder="Ingresa un valor o palabra..."
                class="sm:col-span-5 bg-[#0a0f24] border border-cyan-500/30 focus:border-cyan-400 rounded-xl px-4 py-2.5 text-white text-xs focus:outline-none font-mono"
              />
              <select
                value={insertMode}
                onChange={(e) => setInsertMode(e.target.value)}
                class="sm:col-span-4 bg-[#0a0f24] border border-cyan-500/30 text-cyan-300 rounded-xl px-3 py-2.5 text-xs font-mono focus:outline-none"
              >
                <option value="auto">⚡ Inserción Automática (BST)</option>
                <option value="left">👈 Insertar a la IZQUIERDA de Padre</option>
                <option value="right">👉 Insertar a la DERECHA de Padre</option>
              </select>
              {insertMode !== 'auto' && (
                <select
                  value={targetParent}
                  onChange={(e) => setTargetParent(e.target.value)}
                  class="sm:col-span-3 bg-[#0a0f24] border border-amber-500/40 text-amber-300 rounded-xl px-3 py-2.5 text-xs font-mono focus:outline-none"
                >
                  <option value="">-- Nodo Padre --</option>
                  {allNodesList.map((val) => (
                    <option key={val} value={val}>
                      Padre: [{val}]
                    </option>
                  ))}
                </select>
              )}
              <button
                type="submit"
                disabled={isAnimating}
                class={`py-2.5 px-4 font-mono font-bold text-xs rounded-xl shadow-lg flex items-center justify-center gap-1.5 transition active:scale-95 ${
                  insertMode !== 'auto' ? 'sm:col-span-12 bg-amber-500 hover:bg-amber-400 text-black' : 'sm:col-span-3 bg-indigo-600 hover:bg-indigo-500 text-white'
                }`}
              >
                <Icon name="plus" className="w-4 h-4" /> Insertar Nodo
              </button>
            </div>
          </form>
          <div class="flex gap-2 bg-[#070b18] p-3 rounded-2xl border border-rose-500/20">
            <select
              value={valToDelete}
              onChange={(e) => setValToDelete(e.target.value)}
              class="flex-1 bg-[#0a0f24] border border-rose-500/30 text-rose-300 rounded-xl px-3 py-2 text-xs font-mono focus:outline-none"
            >
              <option value="">-- Elige nodo/palabra a eliminar --</option>
              {allNodesList.map((val) => (
                <option key={val} value={val}>
                  Nodo [{val}]
                </option>
              ))}
            </select>
            <button
              type="button"
              disabled={isAnimating || !valToDelete}
              onClick={() => handleDeleteValue(valToDelete)}
              class="px-4 py-2 bg-rose-600 hover:bg-rose-500 disabled:opacity-50 text-white font-mono font-bold text-xs rounded-xl shadow-lg flex items-center gap-1.5 transition active:scale-95"
            >
              <Icon name="trash-2" className="w-4 h-4" /> Eliminar
            </button>
            <button
              type="button"
              onClick={handleClearTree}
              class="px-3 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-400 hover:text-white font-mono font-bold text-xs rounded-xl transition"
            >
              Vaciar
            </button>
          </div>
          <div class="space-y-3 pt-2 border-t border-slate-800">
            <span class="text-xs font-mono text-slate-400 font-bold block">
              Algoritmos de Recorrido Animados:
            </span>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <button
                type="button"
                disabled={isAnimating || !treeData}
                onClick={() => animateTraversal(getInorder(treeData), 'Inorden (Izq - Raíz - Der)')}
                class="py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:opacity-90 disabled:opacity-50 text-white font-mono font-bold text-xs rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2"
              >
                <Icon name="arrow-right-left" className="w-4 h-4" /> Recorrido Inorden
              </button>
              <button
                type="button"
                disabled={isAnimating || !treeData}
                onClick={() => animateTraversal(getPreorder(treeData), 'Preorden (Raíz - Izq - Der)')}
                class="py-3 px-4 bg-gradient-to-r from-purple-600 to-fuchsia-600 hover:opacity-90 disabled:opacity-50 text-white font-mono font-bold text-xs rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2"
              >
                <Icon name="arrow-up-right" className="w-4 h-4" /> Recorrido Preorden
              </button>
              <button
                type="button"
                disabled={isAnimating || !treeData}
                onClick={() => animateTraversal(getPostorder(treeData), 'Postorden (Izq - Der - Raíz)')}
                class="py-3 px-4 bg-gradient-to-r from-cyan-600 to-teal-600 hover:opacity-90 disabled:opacity-50 text-white font-mono font-bold text-xs rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2"
              >
                <Icon name="arrow-down-right" className="w-4 h-4" /> Recorrido Postorden
              </button>
            </div>
          </div>
          {traversalResult.length > 0 && (
            <div class="bg-[#070c1e] p-4 rounded-xl border border-cyan-500/30 space-y-2">
              <div class="flex items-center justify-between text-xs font-mono">
                <span class="text-cyan-300 font-bold">Secuencia {currentTraversalType}:</span>
                <span class="text-slate-400">{traversalResult.length} nodos visitados</span>
              </div>
              <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar py-1">
                {traversalResult.map((val, idx) => (
                  <React.Fragment key={idx}>
                    <span class="px-3 py-1.5 bg-indigo-950 border border-indigo-400/50 text-cyan-200 font-mono font-bold text-xs rounded-lg shadow-md node-pop">
                      {val}
                    </span>
                    {idx < traversalResult.length - 1 && (
                      <span class="text-slate-500 font-mono font-bold">→</span>
                    )}
                  </React.Fragment>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- GRAFO NO DIRIGIDO CON POSICIONAMIENTO COMPLETAMENTE CENTRADO ---
    function GrafoModulo({ showToast, sound, animSpeed }) {
      const [nodes, setNodes] = useState([
        { id: 'A' },
        { id: 'B' },
        { id: 'C' },
        { id: 'D' },
        { id: 'E' }
      ]);
      const [edges, setEdges] = useState([
        { from: 'A', to: 'B' },
        { from: 'B', to: 'C' },
        { from: 'C', to: 'D' },
        { from: 'D', to: 'E' },
        { from: 'E', to: 'A' }
      ]);
      const [nuevoVertice, setNuevoVertice] = useState('');
      const [origA, setOrigA] = useState('');
      const [destA, setDestA] = useState('');
      const [verticeToDelete, setVerticeToDelete] = useState('');
      
      const [activeNode, setActiveNode] = useState(null);
      const [visitedNodes, setVisitedNodes] = useState([]);
      const [isAnimating, setIsAnimating] = useState(false);

      const containerRef = useRef(null);
      const [dimensions, setDimensions] = useState({ width: 600, height: 320 });

      // Ajustar dimensiones del contenedor dinámicamente
      useEffect(() => {
        const updateSize = () => {
          if (containerRef.current) {
            setDimensions({
              width: containerRef.current.clientWidth || 600,
              height: containerRef.current.clientHeight || 320
            });
          }
        };
        updateSize();
        window.addEventListener('resize', updateSize);
        return () => window.removeEventListener('resize', updateSize);
      }, []);

      // CÁLCULO POLAR MATEMÁTICO PERFECTAMENTE CENTRADO
      const getCalculatedPositions = () => {
        const total = nodes.length;
        if (total === 0) return {};
        const centerX = dimensions.width / 2;
        const centerY = dimensions.height / 2;
        // Radio dinámico adaptado al alto y ancho del contenedor
        const radius = Math.min(centerX, centerY) - 55;

        const posMap = {};
        nodes.forEach((n, idx) => {
          // Ángulo uniforme con desfase para iniciar arriba centrado
          const angle = (idx * 2 * Math.PI) / total - Math.PI / 2;
          posMap[String(n.id)] = {
            x: centerX + radius * Math.cos(angle),
            y: centerY + radius * Math.sin(angle)
          };
        });
        return posMap;
      };

      const computedPos = getCalculatedPositions();

      const agregarVertice = (e) => {
        if (e) e.preventDefault();
        const idTrim = nuevoVertice.trim();
        if (!idTrim) {
          showToast('⚠️ Ingresa un valor o palabra válida para el vértice', 'warning');
          return;
        }
        if (nodes.some(n => String(n.id) === idTrim)) {
          showToast(`⚠️ El vértice '${idTrim}' ya existe en el grafo`, 'warning');
          return;
        }
        setNodes([...nodes, { id: idTrim }]);
        setNuevoVertice('');
        if (sound) playSound('insert');
        showToast(`✅ Vértice '${idTrim}' agregado al grafo`, 'success');
      };

      const conectarArista = (e) => {
        if (e) e.preventDefault();
        const o = origA.trim();
        const d = destA.trim();
        if (!o || !d) {
          showToast('⚠️ Selecciona Origen y Destino para conectar', 'warning');
          return;
        }
        if (o === d) {
          showToast('⚠️ No se permiten bucles al mismo vértice', 'warning');
          return;
        }
        const existeOrigen = nodes.some(n => String(n.id) === o);
        const existeDestino = nodes.some(n => String(n.id) === d);
        if (!existeOrigen || !existeDestino) {
          showToast('❌ Uno o ambos vértices no existen', 'error');
          return;
        }
        const yaConectados = edges.some(
          e => (String(e.from) === o && String(e.to) === d) || (String(e.from) === d && String(e.to) === o)
        );
        if (yaConectados) {
          showToast('⚠️ Esa conexión ya existe', 'warning');
          return;
        }
        setEdges([...edges, { from: o, to: d }]);
        setOrigA('');
        setDestA('');
        if (sound) playSound('click');
        showToast(`🔗 Arista creada entre '${o}' y '${d}'`, 'success');
      };

      const eliminarVertice = (idTarget) => {
        const targetStr = String(idTarget).trim();
        if (!targetStr) return;
        setNodes(prev => prev.filter(n => String(n.id) !== targetStr));
        setEdges(prev => prev.filter(e => String(e.from) !== targetStr && String(e.to) !== targetStr));
        setVerticeToDelete('');
        setVisitedNodes([]);
        if (sound) playSound('delete');
        showToast(`🗑️ Vértice '${targetStr}' y sus conexiones eliminados`, 'info');
      };

      const simularBFS = () => {
        if (nodes.length === 0 || isAnimating) return;
        setIsAnimating(true);
        setVisitedNodes([]);
        const startNode = nodes[0].id;
        const queue = [startNode];
        const visitedSet = new Set([startNode]);
        const order = [];
        const adj = {};
        nodes.forEach(n => adj[n.id] = []);
        edges.forEach(e => {
          if (adj[e.from]) adj[e.from].push(e.to);
          if (adj[e.to]) adj[e.to].push(e.from);
        });
        while (queue.length > 0) {
          const curr = queue.shift();
          order.push(curr);
          const neighbors = adj[curr] || [];
          for (let neighbor of neighbors) {
            if (!visitedSet.has(neighbor)) {
              visitedSet.add(neighbor);
              queue.push(neighbor);
            }
          }
        }
        let step = 0;
        const intervalTime = Math.max(300, 800 / animSpeed);
        const timer = setInterval(() => {
          if (step < order.length) {
            const currId = order[step];
            setActiveNode(currId);
            setVisitedNodes(prev => [...prev, currId]);
            if (sound) playSound('click');
            step++;
          } else {
            clearInterval(timer);
            setActiveNode(null);
            setIsAnimating(false);
            if (sound) playSound('success');
            showToast(`✨ Búsqueda BFS completada: [ ${order.join(' → ')} ]`, 'info');
          }
        }, intervalTime);
      };

      const vaciarGrafo = () => {
        setNodes([]);
        setEdges([]);
        setVisitedNodes([]);
        if (sound) playSound('delete');
        showToast('🧹 Grafo vaciado por completo', 'warning');
      };

      return (
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-emerald-500/30 space-y-6 page-enter">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                <h3 class="text-xl font-black text-emerald-300">7. Grafo No Dirigido (Vértices Centrados)</h3>
              </div>
              <p class="text-xs text-slate-400 font-mono mt-1">
                Visualización simétrica y balanceada en el canvas • Propagación de ondas BFS
              </p>
            </div>
            <div class="flex items-center gap-2">
              <span class="px-3 py-1 bg-emerald-950/80 border border-emerald-500/40 text-emerald-300 text-xs font-mono font-bold rounded-full">
                Vértices: {nodes.length} | Aristas: {edges.length}
              </span>
            </div>
          </div>
          
          {/* LIENZO DE CANVAS CENTRADO */}
          <div ref={containerRef} class="relative bg-[#050814] rounded-2xl border border-slate-800 h-[340px] w-full flex items-center justify-center overflow-hidden">
            <svg class="absolute inset-0 w-full h-full pointer-events-none z-0">
              {edges.map((edge, idx) => {
                const p1 = computedPos[String(edge.from)];
                const p2 = computedPos[String(edge.to)];
                if (!p1 || !p2) return null;
                const isVisited = visitedNodes.map(String).includes(String(edge.from)) && visitedNodes.map(String).includes(String(edge.to));
                return (
                  <line
                    key={idx}
                    x1={p1.x}
                    y1={p1.y}
                    x2={p2.x}
                    y2={p2.y}
                    stroke={isVisited ? '#00f2fe' : '#1e293b'}
                    strokeWidth={isVisited ? '3' : '2'}
                    strokeDasharray={isVisited ? 'none' : '4'}
                    class="transition-all duration-500"
                  />
                );
              })}
            </svg>
            
            {nodes.length === 0 ? (
              <div class="text-center font-mono text-xs text-slate-500 py-10 space-y-2 relative z-10">
                <p>[ El Grafo está vacío ]</p>
                <p class="text-[10px] text-slate-600">Agrega un vértice o número abajo para construir la red</p>
              </div>
            ) : (
              <div class="absolute inset-0 w-full h-full pointer-events-none z-10">
                {nodes.map((node) => {
                  const nodeStr = String(node.id);
                  const pos = computedPos[nodeStr];
                  if (!pos) return null;
                  const isActive = String(activeNode) === nodeStr;
                  const isVisited = visitedNodes.map(String).includes(nodeStr);
                  
                  return (
                    <button
                      key={nodeStr}
                      type="button"
                      onClick={() => eliminarVertice(nodeStr)}
                      title={`Haz clic para eliminar el vértice '${nodeStr}'`}
                      style={{ 
                        left: `${pos.x}px`, 
                        top: `${pos.y}px`, 
                        transform: 'translate(-50%, -50%)' 
                      }}
                      class={`absolute min-w-[50px] h-12 px-3 rounded-full border-2 flex items-center justify-center font-mono font-black text-xs transition-all duration-300 shadow-xl cursor-pointer pointer-events-auto group hover:scale-115 ${
                        isActive
                          ? 'bg-amber-400 border-amber-200 text-black scale-125 shadow-amber-400/80 ring-4 ring-amber-400/40 animate-pulse z-30'
                          : isVisited
                          ? 'bg-gradient-to-tr from-emerald-600 to-cyan-500 border-cyan-300 text-black scale-105 shadow-cyan-500/50 z-20'
                          : 'bg-[#0b1021] border-cyan-400/60 text-cyan-200 hover:border-rose-400 hover:bg-rose-950 z-10'
                      }`}
                    >
                      <span class="group-hover:hidden truncate max-w-[70px]">{nodeStr}</span>
                      <span class="hidden group-hover:inline text-xs font-bold text-rose-300">✕</span>
                    </button>
                  );
                })}
              </div>
            )}
            
            <button
              type="button"
              disabled={isAnimating || nodes.length === 0}
              onClick={simularBFS}
              class="absolute bottom-4 right-4 px-5 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black font-mono font-extrabold text-xs rounded-xl shadow-lg shadow-emerald-500/30 flex items-center gap-2 transition active:scale-95 z-30"
            >
              <Icon name="play" className="w-4 h-4" /> Simular BFS
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <form onSubmit={agregarVertice} class="bg-[#070b18] p-4 rounded-2xl border border-slate-800 space-y-2">
              <span class="text-xs font-mono font-bold text-slate-300 block">Agregar Vértice:</span>
              <div class="flex gap-2">
                <input
                  type="text"
                  value={nuevoVertice}
                  onChange={(e) => setNuevoVertice(e.target.value)}
                  placeholder="Ej: Cartagena, 10, B..."
                  class="flex-1 bg-[#0a0f24] border border-emerald-500/30 focus:border-emerald-400 rounded-xl px-3 py-2 text-white text-xs focus:outline-none font-mono"
                />
                <button
                  type="submit"
                  class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-black font-mono font-bold text-xs rounded-xl shadow-lg transition active:scale-95"
                >
                  Crear
                </button>
              </div>
            </form>
            <form onSubmit={conectarArista} class="bg-[#070b18] p-4 rounded-2xl border border-slate-800 space-y-2">
              <span class="text-xs font-mono font-bold text-slate-300 block">Conectar Arista:</span>
              <div class="grid grid-cols-12 gap-2">
                <select
                  value={origA}
                  onChange={(e) => setOrigA(e.target.value)}
                  class="col-span-5 bg-[#0a0f24] border border-cyan-500/30 text-cyan-300 rounded-xl px-2 py-2 text-xs font-mono focus:outline-none"
                >
                  <option value="">Origen</option>
                  {nodes.map(n => <option key={n.id} value={n.id}>{n.id}</option>)}
                </select>
                <select
                  value={destA}
                  onChange={(e) => setDestA(e.target.value)}
                  class="col-span-5 bg-[#0a0f24] border border-cyan-500/30 text-cyan-300 rounded-xl px-2 py-2 text-xs font-mono focus:outline-none"
                >
                  <option value="">Destino</option>
                  {nodes.map(n => <option key={n.id} value={n.id}>{n.id}</option>)}
                </select>
                <button
                  type="submit"
                  class="col-span-2 bg-cyan-600 hover:bg-cyan-500 text-black font-mono font-bold text-xs rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center"
                >
                  <Icon name="link" className="w-4 h-4" />
                </button>
              </div>
            </form>
          </div>
          
          <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-800">
            <select
              value={verticeToDelete}
              onChange={(e) => setVerticeToDelete(e.target.value)}
              class="flex-1 min-w-[180px] bg-[#070b18] border border-rose-500/30 text-rose-300 rounded-xl px-3 py-2 text-xs font-mono focus:outline-none"
            >
              <option value="">-- Selecciona Vértice a Eliminar --</option>
              {nodes.map(n => (
                <option key={n.id} value={n.id}>
                  Vértice [{n.id}]
                </option>
              ))}
            </select>
            <button
              type="button"
              disabled={!verticeToDelete}
              onClick={() => eliminarVertice(verticeToDelete)}
              class="px-4 py-2 bg-rose-600 hover:bg-rose-500 disabled:opacity-50 text-white font-mono font-bold text-xs rounded-xl shadow-lg flex items-center gap-1.5 transition active:scale-95"
            >
              <Icon name="trash-2" className="w-4 h-4" /> Eliminar Vértice
            </button>
            <button
              type="button"
              onClick={vaciarGrafo}
              class="px-4 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-400 hover:text-white font-mono font-bold text-xs rounded-xl transition ml-auto"
            >
              Vaciar Grafo
            </button>
          </div>
          {visitedNodes.length > 0 && (
            <div class="bg-[#070c1e] p-4 rounded-xl border border-emerald-500/30 space-y-2">
              <div class="flex items-center justify-between text-xs font-mono">
                <span class="text-emerald-300 font-bold">Secuencia BFS (Anchura):</span>
                <span class="text-slate-400">{visitedNodes.length} vértices recorridos</span>
              </div>
              <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar py-1">
                {visitedNodes.map((id, idx) => (
                  <React.Fragment key={idx}>
                    <span class="px-3 py-1.5 bg-emerald-950 border border-emerald-400/50 text-emerald-200 font-mono font-bold text-xs rounded-lg shadow-md node-pop">
                      {id}
                    </span>
                    {idx < visitedNodes.length - 1 && (
                      <span class="text-slate-500 font-mono font-bold">→</span>
                    )}
                  </React.Fragment>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
