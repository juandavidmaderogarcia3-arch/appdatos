<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIPA 11 - Visualizador de Estructuras de Datos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #050711;
      color: #f8fafc;
      overflow-x: hidden;
    }

    code, .font-mono {
      font-family: 'Fira Code', monospace;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #090d16;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #00f2fe;
    }
    
    /* PALETA CYBERPUNK FINTECH & GLASSMORPHISM */
    .glass-panel {
      background: rgba(13, 18, 36, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 242, 254, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }
    .glass-panel-glow {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(243, 85, 218, 0.3);
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.12), inset 0 0 20px rgba(243, 85, 218, 0.08);
    }
    .node-pop {
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.3) translateY(20px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .pulse-glow {
      animation: glowPulse 1.8s infinite alternate;
    }
    @keyframes glowPulse {
      0% { box-shadow: 0 0 8px rgba(0, 242, 254, 0.5), inset 0 0 8px rgba(0, 242, 254, 0.3); }
      100% { box-shadow: 0 0 35px rgba(243, 85, 218, 0.9), 0 0 60px rgba(0, 242, 254, 0.6); }
    }
    .scanline-grid {
      background-size: 50px 50px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(243, 85, 218, 0.12), transparent 70%),
        radial-gradient(circle at 0% 100%, rgba(0, 242, 254, 0.1), transparent 60%),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }
    .bar-sort {
      transition: height 0.3s ease, background-color 0.2s ease, transform 0.2s ease, box-shadow 0.3s ease;
    }
    
    /* ANIMACIONES AVATARES */
    .avatar-float {
      animation: floatAvatar 3s ease-in-out infinite;
    }
    @keyframes floatAvatar {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(1.5deg); }
    }
    .avatar-blink {
      animation: blinkEye 4s infinite;
      transform-origin: center;
    }
    @keyframes blinkEye {
      0%, 94%, 98%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .page-enter {
      animation: slideFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideFadeIn {
      0% { opacity: 0; transform: translateY(20px) scale(0.99); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .neon-gradient-text {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 35%, #f355da 70%, #ff5858 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes flashSweep {
      0% { transform: translateX(-100%) skewX(-12deg); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateX(100%) skewX(-12deg); opacity: 0; }
    }

    /* ANIMACIÓN BORDES NEÓN GIRATORIOS CONTINUOS (SNAKE BORDER BEAM) */
    .animated-border-card {
      position: relative;
      border-radius: 1.5rem;
      overflow: hidden;
      padding: 1.5px;
    }
    .animated-border-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        transparent 0deg,
        transparent 280deg,
        #00f2fe 320deg,
        #f355da 360deg
      );
      animation: rotateBorder 4s linear infinite;
      z-index: 0;
    }
    .animated-border-card::after {
      content: '';
      position: absolute;
      inset: 1px;
      background: #090d1e;
      border-radius: calc(1.5rem - 1px);
      z-index: 1;
    }
    .animated-border-card > * {
      position: relative;
      z-index: 2;
    }
    @keyframes rotateBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-[#050711] text-slate-100 min-h-screen scanline-grid selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- SINTETIZADOR DE SONIDO WEB AUDIO API ---
    const playSound = (type = 'click') => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'splash') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.exponentialRampToValueAtTime(700, now + 0.4);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
          osc.start(now);
          osc.stop(now + 0.5);
        } else if (type === 'push' || type === 'insert') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'pop' || type === 'delete') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(700, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.18);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(110, now + 0.1);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.25);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(480, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
          osc.start(now);
          osc.stop(now + 0.04);
        }
      } catch (e) {}
    };

    // --- COMPONENTE DE ICONOS LUCIDE ---
    const Icon = ({ name, className = "w-5 h-5" }) => {
      useEffect(() => {
        const timer = setTimeout(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, 10);
        return () => clearTimeout(timer);
      }, [name]);
      return <i data-lucide={name} class={className}></i>;
    };

    // --- HELPER DIRECCIÓN HEXADECIMAL RAM ---
    const getHexAddr = (base = 0x7FFF00, offset = 0) => {
      return '0x' + (base + offset * 8).toString(16).toUpperCase();
    };

    // --- PANTALLA INTRO SPLASH CIPA 11 (15s EXACTOS) ---
    function SplashScreen({ onComplete, soundEnabled }) {
      const [progress, setProgress] = useState(0);
      const [statusText, setStatusText] = useState('Inicializando Núcleo CIPA 11...');
      const [isLaunching, setIsLaunching] = useState(false);
      
      const [showText, setShowText] = useState(false);
      const [typedText, setTypedText] = useState('');
      const [triggerFlash, setTriggerFlash] = useState(false);

      const fullText = "CIPA 11";

      useEffect(() => {
        const steps = [
          { p: 10, msg: 'Estableciendo canal seguro de bus de datos RAM...' },
          { p: 25, msg: 'Asignando bloques de memoria estática y dinámica...' },
          { p: 35, msg: 'Compilando punteros y referencias hexadecimales...' },
          { p: 50, msg: 'Cargando motor gráfico Canvas 2D de alta resolución...' },
          { p: 65, msg: 'Compilando punteros de Árboles BST y Grafos no dirigidos...' },
          { p: 78, msg: 'Inicializando sintetizador de audio Hi-Fi y analizador Big-O...' },
          { p: 88, msg: 'Ejecutando pruebas de integridad LIFO / FIFO y BFS...' },
          { p: 95, msg: 'Calibrando renderizado de animaciones y transiciones...' },
          { p: 100, msg: '¡Suite CIPA 11 operacional! Desplegando entorno...' }
        ];

        let currentStep = 0;
        const stepInterval = 15000 / steps.length;

        const interval = setInterval(() => {
          if (currentStep < steps.length) {
            setProgress(steps[currentStep].p);
            setStatusText(steps[currentStep].msg);
            if (soundEnabled) playSound('click');
            currentStep++;
          } else {
            clearInterval(interval);
            if (soundEnabled) playSound('splash');
            setIsLaunching(true);
            setTimeout(() => {
              onComplete();
            }, 600);
          }
        }, stepInterval);

        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        const timerTextShow = setTimeout(() => {
          setShowText(true);
          let charIndex = 0;
          const typingInterval = setInterval(() => {
            if (charIndex < fullText.length) {
              setTypedText(fullText.substring(0, charIndex + 1));
              if (soundEnabled) playSound('click');
              charIndex++;
            } else {
              clearInterval(typingInterval);
              setTimeout(() => {
                setTriggerFlash(true);
                if (soundEnabled) playSound('success');
              }, 300);
            }
          }, 180);
        }, 3000);

        return () => clearTimeout(timerTextShow);
      }, []);

      return (
        <div class={`fixed inset-0 z-50 bg-[#04060b] flex flex-col items-center justify-center p-6 transition-all duration-700 ${isLaunching ? 'opacity-0 scale-105 pointer-events-none' : 'opacity-100 scale-100'}`}>
          <div class="max-w-xl w-full text-center space-y-6 relative z-10 page-enter">
            
            {/* Ícono Centrado Neón */}
            <div class="relative mx-auto w-24 h-24 flex items-center justify-center transition-all duration-700 transform hover:scale-110">
              <div class="w-full h-full bg-gradient-to-tr from-cyan-400 via-fuchsia-500 to-indigo-500 rounded-2xl p-[2px] shadow-[0_0_40px_rgba(0,242,254,0.4)] animate-pulse">
                <div class="w-full h-full bg-[#070a14] rounded-[14px] flex items-center justify-center relative border border-cyan-400/30">
                  <Icon name="cpu" className="w-12 h-12 text-cyan-300 relative z-10" />
                </div>
              </div>
            </div>

            {/* Texto CIPA 11: Aparece a los 3s con Mecanografía y Flash de Resplandor */}
            <div class="h-16 flex items-center justify-center">
              {showText && (
                <div class="relative inline-block overflow-hidden px-4 py-1">
                  <h1 class="text-4xl md:text-5xl font-extrabold tracking-wider text-white font-mono">
                    <span class="neon-gradient-text">{typedText}</span>
                    {typedText.length < fullText.length && (
                      <span class="inline-block w-2.5 h-8 bg-cyan-400 ml-1 animate-ping"></span>
                    )}
                  </h1>

                  {triggerFlash && (
                    <div 
                      class="absolute inset-0 bg-gradient-to-r from-transparent via-white to-transparent opacity-90 -skew-x-12 pointer-events-none"
                      style={{ animation: 'flashSweep 0.8s ease-in-out forwards' }}
                    />
                  )}
                </div>
              )}
            </div>

            {/* Barra de Carga Neón de 15 Segundos */}
            <div class="w-full max-w-md mx-auto space-y-3 pt-2 font-mono">
              <div class="w-full bg-[#080d1a] h-3 rounded-full overflow-hidden p-0.5 border border-cyan-500/20 shadow-inner">
                <div 
                  style={{ width: `${progress}%` }} 
                  class="h-full bg-gradient-to-r from-cyan-400 via-blue-500 to-fuchsia-400 rounded-full transition-all duration-500 ease-out shadow-[0_0_15px_rgba(0,242,254,0.8)]"
                ></div>
              </div>
              
              <div class="flex justify-between items-center text-[11px] text-slate-400 px-1">
                <span class="truncate max-w-[320px] text-left">{statusText}</span>
                <span class="text-cyan-300 font-bold">{progress}%</span>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // --- MODAL INTERACTIVO DE REGISTRO E INICIO DE SESIÓN ---
    function UserWelcomeModal({ onConfirm, soundEnabled }) {
      const [name, setName] = useState('');
      const [role, setRole] = useState('Estudiante');
      const [selectedAvatar, setSelectedAvatar] = useState('man');
      const [errorMsg, setErrorMsg] = useState('');

      const avatars = [
        { 
          id: 'man', 
          name: 'Hombre', 
          renderSvg: () => (
            <svg viewBox="0 0 100 100" class="w-20 h-20 avatar-float drop-shadow-[0_0_15px_rgba(0,242,254,0.8)]">
              <path d="M 25 38 C 25 15, 75 15, 75 38 C 75 22, 60 18, 50 20 C 35 18, 25 25, 25 38 Z" fill="#00f2fe" />
              <circle cx="50" cy="42" r="20" fill="#fce7f3" stroke="#00f2fe" stroke-width="2" />
              <circle cx="43" cy="40" r="3" fill="#0f172a" class="avatar-blink" />
              <circle cx="57" cy="40" r="3" fill="#0f172a" class="avatar-blink" />
              <circle cx="44" cy="39" r="1" fill="#ffffff" />
              <circle cx="58" cy="39" r="1" fill="#ffffff" />
              <path d="M 43 49 Q 50 54 57 49" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none" />
              <rect x="44" y="60" width="12" height="8" fill="#fce7f3" />
              <path d="M 22 88 C 22 66, 78 66, 78 88 Z" fill="url(#gradMan)" stroke="#00f2fe" stroke-width="2" />
              <path d="M 38 68 L 50 82 L 62 68" fill="none" stroke="#00f2fe" stroke-width="2.5" />
              <defs>
                <linearGradient id="gradMan" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#091533" />
                  <stop offset="100%" stop-color="#0284c7" />
                </linearGradient>
              </defs>
            </svg>
          ) 
        },
        { 
          id: 'woman', 
          name: 'Mujer', 
          renderSvg: () => (
            <svg viewBox="0 0 100 100" class="w-20 h-20 avatar-float drop-shadow-[0_0_15px_rgba(243,85,218,0.8)]">
              <path d="M 20 40 C 20 12, 80 12, 80 40 C 82 62, 76 75, 74 80 C 70 65, 75 42, 70 30 C 60 18, 40 18, 30 30 C 25 42, 30 65, 26 80 C 24 75, 18 62, 20 40 Z" fill="#f355da" />
              <circle cx="50" cy="42" r="19" fill="#fff1f2" stroke="#f355da" stroke-width="2" />
              <circle cx="43" cy="41" r="3" fill="#0f172a" class="avatar-blink" />
              <circle cx="57" cy="41" r="3" fill="#0f172a" class="avatar-blink" />
              <circle cx="44" cy="40" r="1" fill="#ffffff" />
              <circle cx="58" cy="40" r="1" fill="#ffffff" />
              <path d="M 39 37 L 42 39 M 61 37 L 58 39" stroke="#f355da" stroke-width="1.5" stroke-linecap="round" />
              <path d="M 44 49 Q 50 55 56 49" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none" />
              <rect x="45" y="59" width="10" height="8" fill="#fff1f2" />
              <path d="M 24 88 C 24 65, 76 65, 76 88 Z" fill="url(#gradWoman)" stroke="#f355da" stroke-width="2" />
              <circle cx="50" cy="74" r="4" fill="#00f2fe" class="animate-pulse" />
              <defs>
                <linearGradient id="gradWoman" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#2e1065" />
                  <stop offset="100%" stop-color="#c026d3" />
                </linearGradient>
              </defs>
            </svg>
          ) 
        }
      ];

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) {
          setErrorMsg('⚠️ Por favor ingresa tu nombre para continuar.');
          if (soundEnabled) playSound('error');
          return;
        }
        if (soundEnabled) playSound('success');
        onConfirm({ name: name.trim(), role, avatar: selectedAvatar });
      };

      return (
        <div class="fixed inset-0 z-50 bg-[#04060f]/90 backdrop-blur-2xl flex items-center justify-center p-4 page-enter">
          <div class="max-w-lg w-full glass-panel-glow p-8 rounded-3xl border border-cyan-500/30 shadow-2xl shadow-cyan-500/20 space-y-6 relative overflow-hidden">
            <div class="absolute -right-12 -top-12 w-40 h-40 bg-cyan-500/10 rounded-full blur-3xl"></div>
            
            <div class="text-center space-y-2 relative z-10">
              <div class="w-16 h-16 mx-auto bg-gradient-to-tr from-cyan-400 via-fuchsia-500 to-indigo-500 rounded-2xl p-0.5 shadow-lg shadow-cyan-500/30 flex items-center justify-center mb-3">
                <div class="w-full h-full bg-[#080d1e] rounded-[14px] flex items-center justify-center">
                  <Icon name="sparkles" className="w-8 h-8 text-cyan-300 animate-pulse" />
                </div>
              </div>
              <h2 class="text-2xl font-extrabold text-white">¡Bienvenido a <span class="neon-gradient-text">CIPA 11</span>!</h2>
              <p class="text-xs text-slate-400 font-mono">Personaliza tu perfil de sesión para ingresar al simulador</p>
            </div>

            <form onSubmit={handleSubmit} class="space-y-5 relative z-10 font-mono text-xs">
              <div>
                <label class="block text-slate-300 mb-1.5 font-semibold">¿Cómo te llamas?</label>
                <input 
                  type="text" 
                  value={name} 
                  onChange={(e) => { setName(e.target.value); setErrorMsg(''); }} 
                  placeholder="Ingresa tu nombre..." 
                  class="w-full bg-[#070b18] border border-cyan-500/30 focus:border-cyan-400 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-cyan-400/30 shadow-inner"
                />
              </div>

              <div>
                <label class="block text-slate-300 mb-1.5 font-semibold">Rol en la sesión:</label>
                <div class="grid grid-cols-2 gap-3">
                  {['Estudiante', 'Docente'].map((r) => (
                    <button
                      type="button"
                      key={r}
                      onClick={() => { setRole(r); if(soundEnabled) playSound('click'); }}
                      class={`py-2.5 rounded-xl border text-center transition font-bold ${role === r ? 'bg-cyan-500 text-black border-cyan-300 shadow-md shadow-cyan-500/30' : 'bg-[#070b18] border-slate-800 text-slate-400 hover:text-white'}`}
                    >
                      {r}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label class="block text-slate-300 mb-2 font-semibold">Selecciona tu avatar:</label>
                <div class="grid grid-cols-2 gap-4">
                  {avatars.map((av) => {
                    const isSelected = selectedAvatar === av.id;
                    return (
                      <button
                        type="button"
                        key={av.id}
                        onClick={() => { setSelectedAvatar(av.id); if(soundEnabled) playSound('click'); }}
                        class={`p-4 rounded-2xl border flex items-center justify-center transition-all duration-300 relative overflow-hidden ${
                          isSelected 
                            ? 'bg-gradient-to-b from-cyan-950/80 to-fuchsia-950/80 border-cyan-400 shadow-xl shadow-cyan-500/40 scale-105 ring-2 ring-cyan-400/50' 
                            : 'bg-[#070b18] border-slate-800 hover:border-slate-700'
                        }`}
                      >
                        {isSelected && (
                          <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500/10 via-fuchsia-500/10 to-transparent pointer-events-none"></div>
                        )}
                        <div class="relative z-10 py-1">
                          {av.renderSvg()}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {errorMsg && (
                <div class="p-2.5 bg-rose-950/70 border border-rose-500/40 rounded-xl text-rose-300 text-center text-[11px] font-sans">
                  {errorMsg}
                </div>
              )}

              <button 
                type="submit"
                class="w-full bg-gradient-to-r from-cyan-400 via-blue-500 to-fuchsia-500 hover:opacity-95 text-black font-extrabold py-3.5 rounded-xl transition-all duration-300 text-sm shadow-xl shadow-cyan-500/30 flex items-center justify-center gap-2 mt-2"
              >
                <span>Ingresar al Dashboard</span>
                <Icon name="arrow-right" className="w-4 h-4" />
              </button>
            </form>
          </div>
        </div>
      );
    }

    // --- APLICACIÓN PRINCIPAL ---
    function App() {
      const [showSplash, setShowSplash] = useState(true);
      const [userProfile, setUserProfile] = useState(null);
      const [activeStructure, setActiveStructure] = useState(null);
      const [toast, setToast] = useState(null);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [animSpeed, setAnimSpeed] = useState(1);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        if (soundEnabled) {
          if (type === 'error') playSound('error');
          else if (type === 'warning') playSound('click');
          else playSound('success');
        }
        setTimeout(() => setToast(null), 4000);
      };

      const triggerCelebration = () => {
        if (window.confetti) {
          window.confetti({
            particleCount: 90,
            spread: 80,
            origin: { y: 0.65 }
          });
        }
      };

      const structuresList = [
        { id: 'arreglo', title: '1. Arreglo 1D y SIMD Sort', desc: 'Memoria contigua en Hexadecimal con gráficos de barras brillantes y ordenamiento interactivo.', icon: 'bar-chart-3', badge: 'Memoria Contigua', O: 'O(1) Acceso', color: 'from-cyan-500 to-blue-600', shadow: 'shadow-cyan-500/30' },
        { id: 'matriz', title: '2. Matriz Bidimensional (2D)', desc: 'Rejilla visual interactiva con mapeo por Fila Mayor y resaltado neón por coordenadas.', icon: 'grid', badge: 'Bidimensional', O: 'O(1) Acceso', color: 'from-blue-500 to-indigo-600', shadow: 'shadow-blue-500/30' },
        { id: 'lista', title: '3. Lista Enlazada Dinámica', desc: 'Nodos encadenados con referencias de memoria Heap y reconexión dinámica animada.', icon: 'git-commit', badge: 'Punteros Dinámicos', O: 'O(N) Búsqueda', color: 'from-indigo-500 to-fuchsia-600', shadow: 'shadow-indigo-500/30' },
        { id: 'pila', title: '4. Pila Animada (Stack)', desc: 'Estructura vertical LIFO con efectos de caída neón, inspección de la cima y detección de overflow.', icon: 'layers', badge: 'LIFO (Stack)', O: 'O(1) Push/Pop', color: 'from-fuchsia-500 to-pink-600', shadow: 'shadow-fuchsia-500/30' },
        { id: 'cola', title: '5. Cola Animada (Queue)', desc: 'Cinta horizontal FIFO con resplandor en extremos de entrada/salida y flujo constante.', icon: 'arrow-right-left', badge: 'FIFO (Queue)', O: 'O(1) Push/Pop', color: 'from-pink-500 to-rose-600', shadow: 'shadow-pink-500/30' },
        { id: 'arbol', title: '6. Árbol Binario (BST Canvas)', desc: 'Visualización jerárquica en Canvas 2D con animaciones de trazado de ramas en resplandor cian.', icon: 'network', badge: 'No Lineal (BST)', O: 'O(log N) Buscar', color: 'from-rose-500 to-amber-500', shadow: 'shadow-rose-500/30' },
        { id: 'grafo', title: '7. Grafo Interactivo (Canvas)', desc: 'Red de vértices con propagación de ondas BFS iluminadas en colores verde neón y cian.', icon: 'share-2', badge: 'Grafo (No Dirigido)', O: 'O(V + E) BFS', color: 'from-emerald-500 to-cyan-500', shadow: 'shadow-emerald-500/30' },
      ];

      return (
        <div class="min-h-screen flex flex-col bg-[#060813] text-slate-100">
          {/* PASO 1: SPLASH SCREEN (15 SEGUNDOS) */}
          {showSplash && (
            <SplashScreen 
              onComplete={() => setShowSplash(false)} 
              soundEnabled={soundEnabled} 
            />
          )}

          {/* PASO 2: MODAL DE REGISTRO / BIENVENIDA */}
          {!showSplash && !userProfile && (
            <UserWelcomeModal 
              onConfirm={(profile) => {
                setUserProfile(profile);
                if (window.confetti) window.confetti({ particleCount: 50, spread: 60 });
              }} 
              soundEnabled={soundEnabled} 
            />
          )}

          {/* PASO 3: DASHBOARD PRINCIPAL */}
          {!showSplash && userProfile && (
            <div class="page-enter flex-1 flex flex-col">
              <header class="sticky top-0 z-40 border-b border-cyan-500/20 bg-[#070a16]/90 backdrop-blur-xl shadow-2xl">
                <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                  <div class="flex items-center gap-3 cursor-pointer group" onClick={() => { setActiveStructure(null); playSound('click'); }}>
                    <div class="p-2.5 bg-gradient-to-tr from-cyan-400 via-blue-600 to-fuchsia-500 rounded-2xl shadow-lg shadow-cyan-500/30 group-hover:scale-105 transition">
                      <Icon name="cpu" className="w-6 h-6 text-black font-bold" />
                    </div>
                    <div>
                      <div class="flex items-center gap-2">
                        <h1 class="font-extrabold text-lg md:text-xl neon-gradient-text">
                          CIPA 11 • Visualizador TCC
                        </h1>
                        <span class="px-2 py-0.5 bg-cyan-500/10 border border-cyan-400/40 text-cyan-300 text-[10px] font-mono rounded font-bold shadow-inner">
                          PRO DASHBOARD
                        </span>
                      </div>
                      <p class="text-xs text-slate-400 font-mono">Estructuras de Datos • Universidad de Cartagena</p>
                    </div>
                  </div>

                  <div class="flex items-center gap-3">
                    <div class="hidden sm:flex items-center gap-2 bg-[#0a0f20] border border-fuchsia-500/30 px-3 py-1.5 rounded-xl text-xs font-mono">
                      <Icon name="user" className="w-3.5 h-3.5 text-fuchsia-400" />
                      <span class="text-white font-bold">{userProfile.name}</span>
                      <span class="px-1.5 py-0.5 bg-fuchsia-950 text-fuchsia-300 text-[9px] rounded font-bold uppercase">{userProfile.role}</span>
                    </div>

                    <div class="hidden md:flex items-center gap-1.5 bg-[#0a0f20] border border-cyan-500/20 px-3 py-1.5 rounded-xl text-xs font-mono text-slate-400">
                      <Icon name="zap" className="w-3.5 h-3.5 text-amber-400" />
                      <span>Velocidad:</span>
                      {[0.5, 1, 2].map(s => (
                        <button 
                          key={s} 
                          onClick={() => setAnimSpeed(s)} 
                          class={`px-2 py-0.5 rounded font-bold ${animSpeed === s ? 'bg-cyan-500 text-black shadow-md shadow-cyan-500/40' : 'hover:text-white'}`}
                        >
                          {s}x
                        </button>
                      ))}
                    </div>

                    <button 
                      onClick={() => { setShowSplash(true); setUserProfile(null); }}
                      class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-cyan-500/20 bg-[#0a0f20] hover:bg-[#121933] text-slate-300 hover:text-white text-xs font-mono font-semibold transition"
                    >
                      <Icon name="rotate-ccw" className="w-3.5 h-3.5 text-cyan-400" />
                      Replay Splash
                    </button>

                    <button 
                      onClick={() => setSoundEnabled(!soundEnabled)}
                      class={`p-2 rounded-xl border text-xs font-semibold transition flex items-center gap-1.5 ${soundEnabled ? 'bg-fuchsia-950/60 border-fuchsia-500/50 text-fuchsia-300 shadow-md shadow-fuchsia-500/20' : 'bg-[#0a0f20] border-slate-800 text-slate-500'}`}
                    >
                      <Icon name={soundEnabled ? "volume-2" : "volume-x"} className="w-4 h-4" />
                      <span class="hidden sm:inline">{soundEnabled ? 'Audio ON' : 'Mudo'}</span>
                    </button>

                    {activeStructure && (
                      <button 
                        onClick={() => { setActiveStructure(null); playSound('click'); }}
                        class="flex items-center gap-2 bg-gradient-to-r from-cyan-500 via-blue-600 to-fuchsia-600 hover:opacity-90 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-lg shadow-cyan-500/30 border border-cyan-400/30"
                      >
                        <Icon name="arrow-left" className="w-4 h-4" />
                        Menú Principal
                      </button>
                    )}
                  </div>
                </div>
              </header>

              {toast && (
                <div class="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-4 rounded-2xl shadow-2xl border text-sm font-semibold animate-bounce backdrop-blur-xl bg-[#090d1a]/95 text-slate-100 border-cyan-400/50 shadow-cyan-500/30">
                  <Icon name={toast.type === 'error' ? 'alert-triangle' : toast.type === 'warning' ? 'alert-circle' : 'check-circle-2'} className={`w-5 h-5 ${toast.type === 'error' ? 'text-rose-400' : toast.type === 'warning' ? 'text-amber-400' : 'text-emerald-400'}`} />
                  <span>{toast.message}</span>
                </div>
              )}

              <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
                {!activeStructure ? (
                  <div class="space-y-8 py-4 page-enter">
                    <div class="text-center max-w-3xl mx-auto space-y-4">
                      <span class="inline-flex items-center gap-2 px-4 py-1.5 bg-gradient-to-r from-cyan-500/10 to-fuchsia-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-mono font-bold rounded-full uppercase tracking-wider shadow-lg">
                        <Icon name="sparkles" className="w-4 h-4 text-fuchsia-400 animate-pulse" />
                        SESIÓN ACTIVA • {userProfile.name.toUpperCase()} ({userProfile.role.toUpperCase()})
                      </span>
                      <h2 class="text-4xl md:text-6xl font-extrabold text-white tracking-tight">
                        Explorador de <span class="neon-gradient-text">Estructuras de Datos</span>
                      </h2>
                      <p class="text-slate-400 text-sm md:text-base leading-relaxed">
                        Selecciona un módulo para visualizar en tiempo real algoritmos con estética de dashboard analítico y direcciones físicas de memoria RAM.
                      </p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {structuresList.map((st) => (
                        <div 
                          key={st.id}
                          onClick={() => { setActiveStructure(st.id); playSound('click'); }}
                          class="animated-border-card group cursor-pointer transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl hover:shadow-cyan-500/30"
                        >
                          <div class="h-full p-6 flex flex-col justify-between relative overflow-hidden bg-[#090d1e] rounded-[calc(1.5rem-1px)]">
                            <div class="absolute -right-10 -top-10 w-36 h-36 bg-cyan-500/10 rounded-full blur-3xl group-hover:bg-fuchsia-500/20 transition"></div>
                            <div class="space-y-4 relative z-10">
                              <div class="flex items-center justify-between">
                                <div class={`p-3.5 bg-[#050814] group-hover:bg-gradient-to-tr ${st.color} text-cyan-400 group-hover:text-black rounded-2xl transition duration-300 shadow-md border border-cyan-500/20 ${st.shadow}`}>
                                  <Icon name={st.icon} className="w-7 h-7" />
                                </div>
                                <div class="flex flex-col items-end">
                                  <span class="text-[10px] px-2.5 py-0.5 bg-[#050814] text-cyan-300 rounded-full font-mono font-bold border border-cyan-500/30">
                                    {st.badge}
                                  </span>
                                  <span class="text-[10px] font-mono text-fuchsia-400 mt-1 font-bold">{st.O}</span>
                                </div>
                              </div>
                              <h3 class="text-xl font-bold text-white group-hover:text-cyan-300 transition">{st.title}</h3>
                              <p class="text-xs text-slate-400 leading-relaxed">{st.desc}</p>
                            </div>
                            
                            <div class="mt-6 pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs font-mono font-bold text-cyan-400 group-hover:text-fuchsia-300 relative z-10">
                              <span>Abrir Módulo</span>
                              <Icon name="arrow-right" className="w-4 h-4 transition transform group-hover:translate-x-2" />
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div class="glass-panel-glow rounded-3xl p-4 md:p-8 shadow-2xl page-enter">
                    {activeStructure === 'arreglo' && <ArregloModulo showToast={showToast} triggerCelebration={triggerCelebration} sound={soundEnabled} animSpeed={animSpeed} />}
                    {activeStructure === 'matriz' && <MatrizModulo showToast={showToast} sound={soundEnabled} />}
                    {activeStructure === 'lista' && <ListaModulo showToast={showToast} sound={soundEnabled} />}
                    {activeStructure === 'pila' && <PilaModulo showToast={showToast} sound={soundEnabled} />}
                    {activeStructure === 'cola' && <ColaModulo showToast={showToast} sound={soundEnabled} />}
                    {activeStructure === 'arbol' && <ArbolModulo showToast={showToast} sound={soundEnabled} animSpeed={animSpeed} />}
                    {activeStructure === 'grafo' && <GrafoModulo showToast={showToast} triggerCelebration={triggerCelebration} sound={soundEnabled} animSpeed={animSpeed} />}
                  </div>
                )}
              </main>
            </div>
          )}
        </div>
      );
    }

    // --- COMPONENTES AUXILIARES Y MÓDULOS DE ESTRUCTURAS ---
    function ComplexityBadge({ access, search, insert, deleteOp, codeSnippet }) {
      const [showCode, setShowCode] = useState(false);
      return (
        <div class="bg-[#080c1b]/90 border border-cyan-500/20 p-4 rounded-2xl space-y-3 font-mono text-xs shadow-xl">
          <div class="flex flex-wrap gap-4 items-center justify-between">
            <span class="text-slate-300 font-sans font-bold flex items-center gap-1.5">
              <Icon name="cpu" className="w-4 h-4 text-cyan-400" /> Complejidad Temporal (Big-O):
            </span>
            <div class="flex flex-wrap gap-3">
              {access && <span class="bg-[#0d1326] border border-cyan-500/30 px-2.5 py-1 rounded-lg text-cyan-300">Acceso: <strong class="text-white">{access}</strong></span>}
              {search && <span class="bg-[#0d1326] border border-blue-500/30 px-2.5 py-1 rounded-lg text-blue-300">Búsqueda: <strong class="text-white">{search}</strong></span>}
              {insert && <span class="bg-[#0d1326] border border-emerald-500/30 px-2.5 py-1 rounded-lg text-emerald-300">Inserción: <strong class="text-white">{insert}</strong></span>}
              {deleteOp && <span class="bg-[#0d1326] border border-rose-500/30 px-2.5 py-1 rounded-lg text-rose-300">Eliminación: <strong class="text-white">{deleteOp}</strong></span>}
            </div>
            {codeSnippet && (
              <button onClick={() => setShowCode(!showCode)} class="text-slate-300 hover:text-white flex items-center gap-1 bg-[#0d1326] px-2.5 py-1 rounded-lg border border-fuchsia-500/30 hover:border-fuchsia-400 transition">
                <Icon name="code" className="w-3.5 h-3.5 text-fuchsia-400" />
                {showCode ? 'Ocultar Código' : 'Ver Algoritmo Python'}
              </button>
            )}
          </div>
          {showCode && codeSnippet && (
            <div class="bg-[#060914] p-4 rounded-xl border border-cyan-500/30 text-slate-300 overflow-x-auto text-[11px] leading-relaxed">
              <pre>{codeSnippet}</pre>
            </div>
          )}
        </div>
      );
    }

    function ArregloModulo({ showToast, triggerCelebration, sound, animSpeed }) {
      const [tamano, setTamano] = useState('');
      const [arreglo, setArreglo] = useState([45, 12, 89, 34, 67, 23, 90, 11]);
      const [isCreated, setIsCreated] = useState(true);
      const [searchIndex, setSearchIndex] = useState('');
      const [modIndex, setModIndex] = useState('');
      const [modValue, setModValue] = useState('');
      const [highlightedIndex, setHighlightedIndex] = useState(null);
      const [isSorting, setIsSorting] = useState(false);
      const [comparingIndices, setComparingIndices] = useState([]);
      const [algorithm, setAlgorithm] = useState('bubble');
      const delay = (ms) => new Promise(r => setTimeout(r, ms / animSpeed));

      const crearArreglo = () => {
        const val = parseInt(tamano);
        if (isNaN(val) || val <= 0 || val > 16) {
          showToast('❌ Ingrese un tamaño válido entre 1 y 16.', 'error');
          return;
        }
        const nuevoArr = Array.from({ length: val }, () => Math.floor(Math.random() * 85) + 10);
        setArreglo(nuevoArr);
        setIsCreated(true);
        if (sound) playSound('insert');
        showToast(`✅ Arreglo de ${val} elementos asignado en RAM.`);
      };

      const consultarIndice = () => {
        const idx = parseInt(searchIndex);
        if (isNaN(idx) || idx < 0 || idx >= arreglo.length) {
          showToast(`❌ Error: Índice fuera de rango (0 a ${arreglo.length - 1}).`, 'error');
          return;
        }
        setHighlightedIndex(idx);
        if (sound) playSound('click');
        showToast(`👉 Memoria [${getHexAddr(0x7FFF10, idx)}] = ${arreglo[idx]}`);
      };

      const modificarIndice = () => {
        const idx = parseInt(modIndex);
        const val = parseInt(modValue);
        if (isNaN(idx) || idx < 0 || idx >= arreglo.length) {
          showToast(`❌ Error: Índice fuera de rango.`, 'error');
          return;
        }
        if (isNaN(val)) {
          showToast('❌ Valor inválido.', 'error');
          return;
        }
        const copia = [...arreglo];
        copia[idx] = val;
        setArreglo(copia);
        setHighlightedIndex(idx);
        if (sound) playSound('success');
        showToast(`✅ Celda [${idx}] modificada a ${val}.`);
      };

      const ejecutarOrdenamiento = async () => {
        setIsSorting(true);
        let arr = [...arreglo];
        let n = arr.length;
        if (algorithm === 'bubble') {
          for (let i = 0; i < n - 1; i++) {
            for (let j = 0; j < n - i - 1; j++) {
              setComparingIndices([j, j + 1]);
              if (sound) playSound('click');
              await delay(250);
              if (arr[j] > arr[j + 1]) {
                let temp = arr[j];
                arr[j] = arr[j + 1];
                arr[j + 1] = temp;
                setArreglo([...arr]);
                if (sound) playSound('push');
                await delay(250);
              }
            }
          }
        } else if (algorithm === 'selection') {
          for (let i = 0; i < n - 1; i++) {
            let minIdx = i;
            for (let j = i + 1; j < n; j++) {
              setComparingIndices([minIdx, j]);
              if (sound) playSound('click');
              await delay(250);
              if (arr[j] < arr[minIdx]) minIdx = j;
            }
            if (minIdx !== i) {
              let temp = arr[i];
              arr[i] = arr[minIdx];
              arr[minIdx] = temp;
              setArreglo([...arr]);
              if (sound) playSound('push');
              await delay(250);
            }
          }
        }
        setComparingIndices([]);
        setIsSorting(false);
        triggerCelebration();
        showToast(`🎉 ¡Arreglo ordenado mediante ${algorithm.toUpperCase()}!`);
      };

      return (
        <div class="space-y-6">
          <div class="flex flex-wrap items-center justify-between border-b border-slate-800 pb-4 gap-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                <Icon name="bar-chart-3" className="text-cyan-400" />
                1. Arreglo Unidimensional & SIMD Ordenamiento
              </h2>
              <p class="text-xs text-slate-400">Direccionamiento contiguo en RAM e inspección paso a paso.</p>
            </div>
            <button onClick={() => setIsCreated(!isCreated)} class="text-xs bg-slate-900 hover:bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 text-cyan-300 font-mono">
              {isCreated ? 'Reconfigurar Tamaño' : 'Ver Arreglo'}
            </button>
          </div>
          <ComplexityBadge 
            access="O(1)" search="O(N)" insert="O(N)" deleteOp="O(N)"
            codeSnippet={`# Algoritmo de Ordenamiento Bubble Sort en Arreglo 1D
def bubble_sort(arreglo):
    n = len(arreglo)
    for i in range(n - 1):
        for j in range(0, n - i - 1):
            if arreglo[j] > arreglo[j + 1]:
                arreglo[j], arreglo[j + 1] = arreglo[j + 1], arreglo[j]`}
          />
          {!isCreated ? (
            <div class="max-w-md bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-4">
              <label class="block text-xs font-semibold text-slate-300 font-mono">Cantidad de elementos (1 a 16):</label>
              <input type="number" value={tamano} onChange={e => setTamano(e.target.value)} placeholder="Ej. 8" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white font-mono focus:outline-none focus:border-cyan-500" />
              <button onClick={crearArreglo} class="w-full bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 text-white font-bold py-2.5 rounded-xl transition shadow-lg shadow-cyan-600/30">
                Inicializar Arreglo en RAM
              </button>
            </div>
          ) : (
            <div class="space-y-6">
              <div class="bg-slate-955 p-6 rounded-3xl border border-slate-800 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-4">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-mono text-slate-400">Algoritmo:</span>
                    <select value={algorithm} onChange={e=>setAlgorithm(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-cyan-300 font-mono">
                      <option value="bubble">Bubble Sort O(N²)</option>
                      <option value="selection">Selection Sort O(N²)</option>
                    </select>
                  </div>
                  <button 
                    disabled={isSorting}
                    onClick={ejecutarOrdenamiento} 
                    class="bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-lg shadow-cyan-600/30 disabled:opacity-50"
                  >
                    <Icon name="play" className="w-4 h-4" />
                    {isSorting ? 'Ejecutando...' : 'Simular Algoritmo'}
                  </button>
                </div>
                <div class="h-60 flex items-end justify-center gap-2.5 pt-6 pb-2 px-4 border-b border-slate-800/80 overflow-x-auto custom-scrollbar">
                  {arreglo.map((val, idx) => {
                    const isComparing = comparingIndices.includes(idx);
                    const isSelected = highlightedIndex === idx;
                    return (
                      <div key={idx} class="flex flex-col items-center gap-2 flex-1 max-w-[55px]">
                        <span class="text-xs font-bold text-white font-mono">{val}</span>
                        <div 
                          style={{ height: `${val * 1.9}px` }}
                          class={`w-full rounded-t-xl bar-sort flex items-center justify-center transition-all ${
                            isComparing ? 'bg-amber-400 scale-105 shadow-xl shadow-amber-400/50' : 
                            isSelected ? 'bg-emerald-400 scale-105 shadow-xl shadow-emerald-400/50' : 
                            'bg-gradient-to-t from-indigo-700 to-cyan-500 hover:from-indigo-600 hover:to-cyan-400'
                          }`}
                        ></div>
                        <span class="text-[9px] font-mono text-cyan-400 bg-slate-900 px-1 py-0.5 rounded border border-slate-800 truncate w-full text-center" title={getHexAddr(0x7FFF10, idx)}>
                          {getHexAddr(0x7FFF10, idx).substring(6)}
                        </span>
                        <span class="text-[10px] font-mono text-slate-500">[{idx}]</span>
                      </div>
                    );
                  })}
                </div>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                  <h4 class="text-xs font-mono font-semibold text-cyan-300">1. Consultar por Índice O(1)</h4>
                  <div class="flex gap-2">
                    <input type="number" placeholder="Índice" value={searchIndex} onChange={e=>setSearchIndex(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono" />
                    <button onClick={consultarIndice} class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-semibold font-mono">Consultar</button>
                  </div>
                </div>
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                  <h4 class="text-xs font-mono font-semibold text-cyan-300">2. Modificar Elemento</h4>
                  <div class="flex gap-2">
                    <input type="number" placeholder="Índice" value={modIndex} onChange={e=>setModIndex(e.target.value)} class="w-1/3 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono" />
                    <input type="number" placeholder="Nuevo valor" value={modValue} onChange={e=>setModValue(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono" />
                    <button onClick={modificarIndice} class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold font-mono">Guardar</button>
                  </div>
                </div>
              </div>
            </div>
          )}
